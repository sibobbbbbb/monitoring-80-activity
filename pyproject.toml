[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".claude-flow"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RET", "PERF", "DTZ", "PT", "RUF"]
ignore = [
    "PT018",  # assert gabungan di test tetap mudah dibaca
    "C408",   # dict(...) lebih rapi untuk argumen Plotly bertingkat
]
allowed-confusables = ["–"]  # tanda pisah rentang di teks UI, disengaja

[tool.ruff.lint.per-file-ignores]
# Waktu naif di file export sengaja: FEXQMS menulis waktu lokal WIB tanpa zona.
"tests/fexqms_fixture.py" = ["DTZ001"]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "app", "core", "db", "scripts", "tests"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
